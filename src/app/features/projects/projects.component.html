<section class="max-w-6xl mx-auto px-5 sm:px-8 py-14 sm:py-16 space-y-12 animate-fade-in">
  <h2
    class="t-section text-center mb-8"
  >
    My Projects
  </h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8">
    <div
      *ngFor="let project of pagedProjects"
      class="bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition duration-300 flex flex-col justify-between"
    >
      <img
        [src]="project.image"
        [alt]="project.alt"
        class="w-full h-52 object-cover"
        loading="lazy"
        decoding="async"
      />
      <div class="p-6 sm:p-7 space-y-3 flex-grow">
        <h3 class="t-title">
          {{ project.title }}
        </h3>
        <p class="t-eyebrow">
          {{ project.type }} · {{ project.year }}
        </p>
        <p class="t-body line-clamp-3">
          {{ project.description }}
        </p>
        <div class="flex flex-wrap gap-1.5 pt-1" *ngIf="project.stack?.length">
          <span
            *ngFor="let tech of project.stack"
            class="chip"
          >
            {{ tech }}
          </span>
        </div>
      </div>
      <div
        class="px-6 sm:px-7 pb-6 sm:pb-7 flex justify-end items-center text-sm sm:text-base"
        *ngIf="project.liveUrl"
      >
        <a
          [href]="project.liveUrl"
          target="_blank"
          rel="noopener"
          class="font-mono text-xs text-accent hover:underline flex items-center gap-1"
        >
          🔗 Live Website
        </a>
      </div>
    </div>
  </div>

  <!-- Pagination Controls -->
  <div class="flex justify-center items-center gap-4 mt-8">
    <button
      (click)="prevPage()"
      [disabled]="page === 1"
      class="px-4 py-2.5 rounded-lg bg-slate-900 text-white font-mono text-xs uppercase tracking-wider disabled:opacity-40 transition"
    >
      Prev
    </button>
    <span class="t-meta">
      Page {{ page }} of {{ totalPages }}
    </span>
    <button
      (click)="nextPage()"
      [disabled]="page === totalPages"
      class="px-4 py-2.5 rounded-lg bg-slate-900 text-white font-mono text-xs uppercase tracking-wider disabled:opacity-40 transition"
    >
      Next
    </button>
  </div>
</section>
